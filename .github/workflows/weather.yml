# TR-004 天氣卡自動更新：每日 06:07、12:07、18:07（香港時間）向 Open-Meteo 攞預報，
# 改寫 index.html 嘅靜態天氣數值；數值有變先 commit，之後請求 GitHub Pages 重新 build。
name: Weather refresh

on:
  schedule:
    - cron: "7 22 * * *"   # 06:07 HKT
    - cron: "7 4 * * *"    # 12:07 HKT
    - cron: "7 10 * * *"   # 18:07 HKT
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: weather-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update weather values
        id: update
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/update_weather.py
            if git diff --quiet -- index.html; then
              echo "No weather change."
              echo "pushed=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add index.html
            git commit -m "Weather auto-refresh $(TZ=Asia/Hong_Kong date '+%d/%m %H:%M') HKT"
            if git push origin HEAD:main; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (main moved); retrying..."
            sleep 10
          done
          exit 1

      # GITHUB_TOKEN 推上去嘅 commit 唔會自動觸發 Pages build（分支發佈模式），所以要手動請求一次。
      - name: Request GitHub Pages build
        if: steps.update.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
